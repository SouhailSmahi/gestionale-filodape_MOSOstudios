# Backup settimanale in Excel (lunedì mattina).
# Crea il file completo (una scheda per tabella + riepiloghi leggibili), lo salva nel gestionale
# (Impostazioni → Backup, si tengono gli ultimi 8) e avvisa Filippo: campanella e, se attivate, notifiche sul telefono.
# Segreti richiesti: SUPABASE_DB_URL (lo stesso del backup notturno). Niente altro da configurare.
name: Backup settimanale in Excel

on:
  schedule:
    - cron: '7 5 * * 1'     # lunedì, 7:07 d'estate / 6:07 d'inverno (ora italiana)
  workflow_dispatch:

jobs:
  excel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Crea il backup e avvisa
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          APP_URL: https://gestionale-filodape-mosostudios.pages.dev
        run: npm run backup
