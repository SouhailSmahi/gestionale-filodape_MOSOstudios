# Il piano gratuito di Supabase mette in pausa il progetto dopo 7 giorni senza attività.
# Questa chiamata ogni 2 giorni lo tiene sveglio. Non legge dati (funzione ping).
# Segreti richiesti: SUPABASE_URL, SUPABASE_ANON_KEY
name: Keep-alive Supabase

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chiama ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          risposta=$(curl -sS --fail-with-body --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Risposta: $risposta"
          test "$risposta" = "true"
