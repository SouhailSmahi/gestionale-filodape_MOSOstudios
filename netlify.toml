# Netlify: account separato da quello del sito filodape.it (i crediti del piano gratuito
# sono condivisi tra i siti dello stesso team: se finiscono, si fermano tutti).
# Variabili d'ambiente da impostare in Netlify → Site configuration → Environment variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_LOGIN_DOMAIN
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# l'app ha indirizzi veri (/ordini, /produzione/lotti/3…): tutti portano a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"
    # se cambia lo script in <head> di index.html, va aggiornato lo sha256 qui sotto
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-I270OiChGKdEFMF/eEF7V1A9mRtLVq2RJRqJPi9meaQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
